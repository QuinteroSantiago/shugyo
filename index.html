<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shugyō">
<meta name="theme-color" content="#111114">
<title>Shugyō</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root {
    --bg: #111114; --card: #1b1b20; --card2: #24242b; --text: #f2f2f4; --muted: #8e8e98;
    --line: #2c2c34; --red: #ef4444; --green: #22c55e; --amber: #f59e0b;
    --safe-t: env(safe-area-inset-top); --safe-b: env(safe-area-inset-bottom);
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f4f6; --card: #fff; --card2: #ececf0; --text: #18181b; --muted: #6b6b75; --line: #e2e2e7; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.4 system-ui, -apple-system, "SF Pro Text", sans-serif;
    padding: calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 24px);
    min-height: 100dvh; -webkit-user-select: none; user-select: none;
    overscroll-behavior-y: none;
  }
  header { display: flex; align-items: center; gap: 10px; margin: 6px 0 18px; }
  header h1 { margin: 0; font-size: 30px; letter-spacing: -.02em; flex: 1; min-width: 0; }
  .langbtn {
    display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 15px;
    font-weight: 600; cursor: pointer; max-width: 100%; margin: -6px 0 16px;
  }
  .langbtn .chev { color: var(--muted); font-size: 12px; }
  .langbtn #langname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lang-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0; }
  .lang-i {
    border: 1px solid transparent; border-radius: 12px; background: var(--card2); color: var(--text);
    font: inherit; font-size: 15px; padding: 12px; cursor: pointer; text-align: center; width: 100%;
  }
  .lang-i.on { border-color: var(--red); color: var(--red); font-weight: 650; }
  .iconbtn {
    width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--card);
    color: var(--text); font-size: 22px; line-height: 1; display: grid; place-items: center; cursor: pointer;
  }
  .iconbtn.primary { background: var(--red); color: #fff; }
  .rule { color: var(--muted); font-size: 14px; margin: 0 0 18px; }

  .list { display: flex; flex-direction: column; gap: 12px; max-width: 560px; margin: 0 auto; }
  .card { background: var(--card); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .card .head { display: flex; align-items: center; gap: 12px; }
  .ring { width: 64px; height: 64px; flex: none; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .n { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
  .card .title { flex: 1; min-width: 0; }
  .card h2 { margin: 0; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .card .sub.warn { color: var(--amber); }
  .card .sub.good { color: var(--green); }
  .dots { display: grid; grid-template-columns: repeat(20, 1fr); gap: 4px; }
  .dots i { aspect-ratio: 1; border-radius: 3px; background: var(--card2); }
  .dots i.on { background: var(--red); }
  .dots i.now { background: var(--green); }
  .go {
    width: 100%; border: 0; border-radius: 14px; padding: 15px; font: inherit; font-weight: 650; font-size: 17px;
    background: var(--red); color: #fff; cursor: pointer; transition: transform .08s;
  }
  .go:active { transform: scale(.98); }
  .go.done { background: var(--card2); color: var(--muted); font-weight: 500; font-size: 15px; }
  .tool {
    display: block; width: 100%; border: 0; border-radius: 14px; padding: 13px; font: inherit; font-size: 15px;
    background: var(--card2); color: var(--text); cursor: pointer; text-align: center; text-decoration: none;
  }
  .tool.running { color: var(--red); font-weight: 650; }
  .tool .clock { font-variant-numeric: tabular-nums; font-size: 20px; }
  textarea.note {
    width: 100%; font: inherit; font-size: 16px; padding: 11px 13px; border-radius: 12px; resize: vertical;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); -webkit-user-select: text; user-select: text;
  }
  .sheet .hist.notes div { display: block; }
  .sheet .hist.notes b { color: var(--text); font-size: 13px; }
  .sheet .hist.notes p { margin: 2px 0 0; white-space: pre-wrap; color: var(--text); }
  .more { border: 0; background: transparent; color: var(--muted); font-size: 22px; padding: 4px 6px; cursor: pointer; }

  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
  .empty b { display: block; color: var(--text); font-size: 20px; margin-bottom: 8px; }

  .install { max-width: 560px; margin: 24px auto 0; color: var(--muted); font-size: 13px; text-align: center; }

  /* bottom sheet */
  .sheet-bg { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: none; z-index: 10; }
  .sheet-bg.open { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--card);
    border-radius: 20px 20px 0 0; padding: 18px 16px calc(var(--safe-b) + 18px);
    transform: translateY(105%); transition: transform .22s ease; max-width: 560px; margin: 0 auto;
  }
  .sheet.open { transform: none; }
  .sheet h3 { margin: 0 0 12px; font-size: 17px; }
  .sheet input {
    width: 100%; font: inherit; font-size: 17px; padding: 13px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); margin-bottom: 12px; -webkit-user-select: text; user-select: text;
  }
  .sheet .btn {
    display: block; width: 100%; border: 0; border-radius: 12px; padding: 14px; font: inherit; font-size: 16px;
    background: var(--card2); color: var(--text); margin-top: 8px; cursor: pointer; text-align: center;
  }
  .sheet .btn.primary { background: var(--red); color: #fff; font-weight: 650; }
  .sheet .btn.danger { color: var(--red); }
  .sheet { max-height: 88dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .tpl { margin-top: 16px; }
  .tpl-g { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 2px 6px; }
  .tpl-i {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; text-align: start;
    border: 0; border-radius: 12px; background: var(--card2); color: var(--text); font: inherit;
    padding: 11px 14px; margin-bottom: 6px; cursor: pointer;
  }
  .tpl-i:active { transform: scale(.99); }
  .tpl-i b { font-size: 15px; }
  .tpl-i span { font-size: 13px; color: var(--text); opacity: .8; }
  .tpl-i small { font-size: 12px; color: var(--muted); }
  .sheet select.lang {
    width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); margin-bottom: 8px;
  }
  .sheet .hist { max-height: 30vh; overflow: auto; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  .sheet .hist div { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--safe-b) + 24px); transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Shugyō</h1>
  <button class="iconbtn" id="menu" aria-label="Settings">⋯</button>
  <button class="iconbtn primary" id="add" aria-label="New challenge">+</button>
</header>
<button class="langbtn" id="langbtn" aria-label="Language"><span aria-hidden="true">🌐</span><span id="langname"></span><span class="chev" aria-hidden="true">▾</span></button>
<p class="rule" id="rule"></p>
<div class="list" id="list"></div>
<p class="install" id="install" hidden></p>

<div class="sheet-bg" id="bg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script src="i18n.js"></script>
<script src="i18n-more.js"></script>
<script src="i18n-world.js"></script>
<script>
"use strict";
const GOAL = 100;
const KEY = "shugyo.v1";

// ---- language: saved choice, else the device's first supported language, else English ----
const LANG_KEY = "shugyo.lang";
let LANG = "en";
function langPref() { try { return localStorage.getItem(LANG_KEY) || "auto"; } catch { return "auto"; } }
function detectLang() {
  for (const l of navigator.languages || [navigator.language || "en"]) {
    const tag = String(l).toLowerCase();
    // Taiwan / Hong Kong / Macau and explicit "Hant" tags read Traditional Chinese.
    if (/^zh-(hant|tw|hk|mo)/.test(tag)) return "zh-Hant";
    const base = { tl: "fil" }[tag.split("-")[0]] || tag.split("-")[0];
    if (LANGS[base]) return base;
  }
  return "en";
}
const L = () => LANGS[LANG] || LANGS.en;
function t(key, vars) {
  let s = L()[key] ?? LANGS.en[key] ?? key;
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.split(`{${k}}`).join(v);
  return s;
}
function applyLang() {
  const p = langPref();
  LANG = p !== "auto" && LANGS[p] ? p : detectLang();
  document.documentElement.lang = LANG;
  document.documentElement.dir = L().dir;
  document.getElementById("rule").textContent = t("rule");
  document.getElementById("install").textContent = t("install");
  document.getElementById("langname").textContent = L().label;
}

// Language picker: a full list, current one ticked. "Automatic" follows the phone.
function openLangSheet() {
  openSheet(s => {
    s.appendChild(el("h3", null, "🌐 " + t("language")));
    const pref = langPref();
    const pick = code => { try { localStorage.setItem(LANG_KEY, code); } catch {} applyLang(); closeSheet(); render(); };
    const auto = el("button", "lang-i" + (pref === "auto" ? " on" : ""), `${t("auto")} · ${LANGS[detectLang()].label}`);
    auto.onclick = () => pick("auto");
    s.appendChild(auto);
    const list = el("div", "lang-list");
    for (const [code, Lx] of Object.entries(LANGS)) {
      const b = el("button", "lang-i" + (pref === code ? " on" : ""), Lx.label);
      b.lang = code; b.dir = Lx.dir;
      b.onclick = () => pick(code);
      list.appendChild(b);
    }
    s.appendChild(list);
    s.appendChild(btn(t("close"), "", closeSheet));
  });
}

// ---- dates: the device's local calendar day ----
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (day, n) => { const [y, m, d] = day.split("-").map(Number); return ymd(new Date(y, m - 1, d + n)); };
const pretty = day => { const [y, m, d] = day.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString(LANG, { month: "short", day: "numeric", year: "numeric" }); };

// ---- per-template tools (by template index; language-independent) ----
// link = a "how to" video, timer = minutes (auto check-in when it ends), note = a daily text box.
const RAJIO_URL = "https://www.youtube.com/results?search_query=%E3%83%A9%E3%82%B8%E3%82%AA%E4%BD%93%E6%93%8D%E7%AC%AC%E4%B8%80";
// Stable template ids, in the same order as LANGS[*].tpl. Challenges store the id,
// so templates can be added/removed without breaking anyone's saved data.
const TPL = ["rajio", "zazen", "soji", "shodo", "hara", "shinrin", "kakeibo", "nikki", "kaizen",
             "read", "pushups", "words", "nophone", "water"];
const OLD_TPL = ["rajio", "zazen", "soji", "shodo", "hara", "shinrin", "kakeibo", "nikki", "kaizen",
                 "read", "pushups", "walk", "meditate", "gratitude", "words", "nophone", "water", "bed", "stretch"]; // v1 numeric indexes
const TOOLS = {
  rajio: { link: RAJIO_URL }, zazen: { timer: 10 }, soji: { timer: 10 }, shinrin: { timer: 20 },
  kakeibo: { note: 1 }, nikki: { note: 1 }, kaizen: { note: 1 }, gratitude: { note: 1 }, words: { note: 1 },
  meditate: { timer: 5 }, stretch: { timer: 5 },
  // Retired templates (no longer offered), kept so existing challenges keep their tools.
  walk: { timer: 20 },
};
const tools = c => TOOLS[c.tpl] || {};
// Challenges made before tools existed: match their name against any language's template names.
function backfillTpl() {
  for (const c of state.challenges) {
    if (typeof c.tpl === "number") c.tpl = OLD_TPL[c.tpl];
    if (c.tpl != null) continue;
    for (const Lx of Object.values(LANGS)) {
      const i = Lx.tpl.findIndex(([name]) => name === c.name);
      if (i >= 0) { c.tpl = TPL[i]; break; }
    }
  }
}

// ---- storage ----
// challenge = { id, name, createdAt, days: [YYYY-MM-DD consecutive], history: [{start,end,days,completed}] }
let state = load();
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.challenges)) return s; } catch {}
  return { challenges: [] };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch { toast(t("saveFail")); }
}

// ---- rules ----
function closeRun(c, completed) {
  if (!c.days.length) return;
  c.history.push({ start: c.days[0], end: c.days[c.days.length - 1], days: c.days.length, completed });
  c.days = [];
}
// A run whose last check-in is before yesterday is broken; a finished run is archived the next day.
function settle() {
  const t = today(), y = addDays(t, -1);
  let changed = false;
  for (const c of state.challenges) {
    const last = c.days[c.days.length - 1];
    if (!last) continue;
    if (c.days.length >= GOAL && last < t) { closeRun(c, true); changed = true; }
    else if (last < y) { closeRun(c, false); changed = true; c.justBroke = true; }
  }
  if (changed) save();
}
const doneToday = c => c.days[c.days.length - 1] === today();
const best = c => Math.max(c.days.length, ...c.history.map(a => a.days), 0);

// ---- render ----
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function ring(n) {
  const r = 28, C = 2 * Math.PI * r, frac = Math.min(n / GOAL, 1);
  const wrap = el("div", "ring");
  wrap.innerHTML = `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--card2)" stroke-width="6"/>` +
    `<circle cx="32" cy="32" r="${r}" fill="none" stroke="${n >= GOAL ? "var(--green)" : "var(--red)"}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C * frac} ${C}"/></svg>`;
  wrap.appendChild(el("div", "n", n));
  return wrap;
}

function render() {
  settle();
  const list = $("list");
  list.innerHTML = "";
  if (!state.challenges.length) {
    const e = el("div", "empty");
    e.appendChild(el("b", null, t("emptyTitle")));
    e.appendChild(el("span", null, t("emptyBody")));
    list.appendChild(e);
  }
  for (const c of state.challenges) {
    const n = c.days.length, done = doneToday(c), won = n >= GOAL;
    const card = el("div", "card");

    const head = el("div", "head");
    head.appendChild(ring(n));
    const title = el("div", "title");
    title.appendChild(el("h2", null, c.name));
    let sub, cls = "sub";
    if (won) { sub = t("completed"); cls += " good"; }
    else if (c.justBroke) { sub = t("broke", { b: best(c) }); cls += " warn"; }
    else if (!n) sub = c.history.length ? t("bestResets", { b: best(c), r: c.history.filter(a => !a.completed).length }) : t("day1");
    else if (done) { sub = t("dayDone", { n }); cls += " good"; }
    else { sub = t("dayPending", { n }); cls += " warn"; }
    title.appendChild(el("div", cls, sub));
    head.appendChild(title);
    const more = el("button", "more", "⋯");
    more.setAttribute("aria-label", "Options");
    more.onclick = () => openDetails(c.id);
    head.appendChild(more);
    card.appendChild(head);

    const dots = el("div", "dots");
    for (let i = 0; i < GOAL; i++) dots.appendChild(el("i", i < n ? (i === n - 1 && done ? "now" : "on") : ""));
    card.appendChild(dots);

    if (!won) {
      const tl = tools(c);
      if (tl.link) {
        const a = el("a", "tool", t("openVideo")); a.href = tl.link; a.target = "_blank"; a.rel = "noopener";
        card.appendChild(a);
      }
      if (tl.timer) {
        const running = state.timer && state.timer.id === c.id;
        const tb = el("button", "tool" + (running ? " running" : ""));
        if (running) { tb.append(el("span", null, t("timerStop") + "  ")); tb.append(el("span", "clock", fmtLeft())); }
        else tb.textContent = t("timerStart", { m: tl.timer });
        tb.onclick = () => running ? stopTimer() : startTimer(c, tl.timer);
        card.appendChild(tb);
      }
      if (tl.note) {
        const ta = el("textarea", "note"); ta.rows = 3; ta.placeholder = t("notePh");
        ta.value = (c.notes || {})[today()] || "";
        ta.oninput = () => {
          c.notes = c.notes || {};
          const v = ta.value.slice(0, 2000);
          if (v.trim()) c.notes[today()] = v; else delete c.notes[today()];
          save();
        };
        card.appendChild(ta);
      }
      const go = el("button", "go" + (done ? " done" : ""), done ? t("btnDone") : t("btnGo", { n: n + 1 }));
      go.onclick = () => {
        if (doneToday(c)) { if (!confirm(t("confirmUndo"))) return; c.days.pop(); }
        else { c.days.push(today()); delete c.justBroke; if (navigator.vibrate) navigator.vibrate(20); if (c.days.length === GOAL) toast(t("toastComplete")); }
        save(); render();
      };
      card.appendChild(go);
    }
    list.appendChild(card);
  }
  const standalone = window.navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  $("install").hidden = standalone;
}

// ---- timer: one at a time, survives reloads via state.timer.endsAt ----
let audio, wake;
function fmtLeft() {
  const ms = Math.max(0, (state.timer?.endsAt || 0) - Date.now());
  const s = Math.ceil(ms / 1000);
  return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
}
async function startTimer(c, minutes) {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch {}
  try { wake = await navigator.wakeLock?.request("screen"); } catch {}
  state.timer = { id: c.id, endsAt: Date.now() + minutes * 60000 };
  save(); render();
}
function stopTimer() {
  state.timer = null; save();
  try { wake?.release(); } catch {} wake = null;
  render();
}
function chime() {
  if (!audio) return;
  try {
    [0, .35, .7].forEach(off => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
      const t0 = audio.currentTime + off;
      g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.4, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + .3);
      o.start(t0); o.stop(t0 + .32);
    });
  } catch {}
}
function tick() {
  if (!state.timer) return;
  if (Date.now() >= state.timer.endsAt) {
    const c = state.challenges.find(x => x.id === state.timer.id);
    if (c && !doneToday(c) && c.days.length < GOAL) { c.days.push(today()); delete c.justBroke; }
    chime(); if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    toast(t("timerDone"));
    stopTimer();
    return;
  }
  const clock = document.querySelector(".tool.running .clock");
  if (clock) clock.textContent = fmtLeft();
}
setInterval(tick, 1000);

// ---- sheets ----
function openSheet(build) {
  const s = $("sheet"); s.innerHTML = ""; build(s);
  $("bg").classList.add("open"); s.classList.add("open");
}
function closeSheet() { $("bg").classList.remove("open"); $("sheet").classList.remove("open"); }
$("bg").onclick = closeSheet;
$("langbtn").onclick = () => openLangSheet();
function btn(text, cls, fn) { const b = el("button", "btn " + (cls || ""), text); b.onclick = fn; return b; }

function nameSheet(titleText, initial, onSave) {
  openSheet(s => {
    s.appendChild(el("h3", null, titleText));
    const inp = el("input"); inp.placeholder = t("placeholder"); inp.value = initial || ""; inp.maxLength = 80;
    s.appendChild(inp);
    const submit = () => { const v = inp.value.trim(); if (!v) return inp.focus(); onSave(v); closeSheet(); render(); };
    inp.onkeydown = e => { if (e.key === "Enter") submit(); };
    s.appendChild(btn(t("save"), "primary", submit));
    s.appendChild(btn(t("cancel"), "", closeSheet));
    setTimeout(() => inp.focus(), 250);
  });
}

function addChallenge(name, tpl) {
  const c = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, createdAt: today(), days: [], history: [] };
  if (tpl != null) c.tpl = tpl;
  state.challenges.push(c);
  save();
}

$("add").onclick = () => openSheet(s => {
  s.appendChild(el("h3", null, t("newTitle")));
  const inp = el("input"); inp.placeholder = t("placeholder"); inp.maxLength = 80;
  s.appendChild(inp);
  let picked = null; // template index, so the challenge gets that template's link/timer/notes
  inp.oninput = () => { if (!inp.value.trim()) picked = null; };
  const submit = () => { const v = inp.value.trim(); if (!v) return inp.focus(); addChallenge(v, picked); closeSheet(); render(); };
  inp.onkeydown = e => { if (e.key === "Enter") submit(); };
  s.appendChild(btn(t("start"), "primary", submit));

  // Starter templates: 0-8 Japanese classics (always kept), 9+ personal growth.
  // Small on purpose — a shugyō only works if you can do it on your worst day.
  const box = el("div", "tpl");
  const tpl = L().tpl;
  tpl.forEach(([name, hint], i) => {
    if (i === 0) box.appendChild(el("div", "tpl-g", t("groupJp")));
    if (i === 9) box.appendChild(el("div", "tpl-g", t("groupGrowth")));
    const b = el("button", "tpl-i");
    b.appendChild(el("b", null, name));
    b.appendChild(el("small", null, hint));
    b.onclick = () => {
      inp.value = name; picked = TPL[i];
      inp.scrollIntoView({ behavior: "smooth", block: "center" });
      toast(t("tplToast"));
    };
    box.appendChild(b);
  });
  s.appendChild(box);
  s.appendChild(btn(t("cancel"), "", closeSheet));
});

function openDetails(id) {
  const c = state.challenges.find(x => x.id === id); if (!c) return;
  openSheet(s => {
    s.appendChild(el("h3", null, c.name));
    const h = el("div", "hist");
    const row = (l, r) => { const d = el("div"); d.appendChild(el("span", null, l)); d.appendChild(el("span", null, r)); h.appendChild(d); };
    if (c.days.length) row(t("currentRun", { d: pretty(c.days[0]) }), t("daysN", { n: c.days.length }));
    for (const a of [...c.history].reverse()) row(`${pretty(a.start)} – ${pretty(a.end)}`, `${t("daysN", { n: a.days })} ${a.completed ? "✓" : "✗"}`);
    if (!c.days.length && !c.history.length) row(t("noRuns"), "");
    s.appendChild(h);
    const notes = Object.entries(c.notes || {}).sort((a, b) => b[0].localeCompare(a[0]));
    if (notes.length) {
      s.appendChild(el("div", "tpl-g", t("notes")));
      const nb = el("div", "hist notes");
      for (const [d, text] of notes) {
        const r = el("div"); r.appendChild(el("b", null, pretty(d))); r.appendChild(el("p", null, text)); nb.appendChild(r);
      }
      s.appendChild(nb);
    }
    s.appendChild(btn(t("rename"), "", () => nameSheet(t("rename"), c.name, v => { c.name = v; save(); })));
    s.appendChild(btn(t("delete"), "danger", () => {
      if (!confirm(t("confirmDelete", { name: c.name }))) return;
      state.challenges = state.challenges.filter(x => x.id !== id);
      if (state.timer && state.timer.id === id) state.timer = null;
      save(); closeSheet(); render();
    }));
    s.appendChild(btn(t("close"), "", closeSheet));
  });
}

// Backup: data lives only on this device, so offer export/import.
$("menu").onclick = () => openSheet(s => {
  s.appendChild(el("h3", null, t("settings")));
  s.appendChild(btn(`🌐 ${t("language")}: ${L().label}`, "", openLangSheet));
  s.appendChild(el("p", "rule", t("dataBody")));
  s.appendChild(btn(t("export"), "", async () => {
    const json = JSON.stringify(state, null, 1);
    const file = new File([json], `shugyo-backup-${today()}.json`, { type: "application/json" });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
    } catch (e) { if (e.name === "AbortError") return; }
    const a = el("a"); a.href = URL.createObjectURL(file); a.download = file.name; a.click();
  }));
  s.appendChild(btn(t("import"), "", () => {
    const inp = el("input"); inp.type = "file"; inp.accept = "application/json,.json";
    inp.onchange = async () => {
      try {
        const data = JSON.parse(await inp.files[0].text());
        if (!data || !Array.isArray(data.challenges)) throw new Error();
        if (!confirm(t("confirmImport"))) return;
        state = data; save(); closeSheet(); render(); toast(t("restored"));
      } catch { toast(t("notBackup")); }
    };
    inp.click();
  }));
  s.appendChild(btn(t("close"), "", closeSheet));
});

let toastT;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2400); }

// Re-check the day when the app comes back to the foreground (iOS keeps PWAs suspended).
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
setInterval(() => { if (document.activeElement?.tagName !== "TEXTAREA") render(); }, 60000);
backfillTpl(); save();
applyLang();
render();
tick();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
</html>
